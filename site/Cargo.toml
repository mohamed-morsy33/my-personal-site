[package]
name = "bigmojourney"
version = "0.1.0"
edition = "2024"

[dependencies]
tera = { version = "2.4.0", features = ["glob_fs"] }
actix-web = "4.17.0"
env_logger = "0.11.11"
actix-files = "0.7.0"
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
toml = "1.1.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
